name: Build Test Package on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency: # Make sure only one approval check runs at a time for the same PR, so the pull_request workflow doesnt fail after a review is submitted
  group: approval-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-package:
    name: "​" # NOTE: Were using a zero-width space to save some visual clutter in the GitHub Pull Request UI
    if: github.event.pull_request.draft == false # Only run if the PR is not a draft

    runs-on: ubuntu-latest

    # Manual approval gate: configure this environment in repo settings with "Required reviewers".
    environment:
      name: pr-artifact-build

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Setup Node v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Check Release Version
        id: version_check
        run: |
          chmod +x utils/release_version_check.sh
          utils/release_version_check.sh

      - name: Stop When Playwright Version Is Unavailable
        if: steps.version_check.outputs.playwright_version == 'v0.0.0'
        run: |
          echo "GitHub API did not return a valid Playwright release tag."
          exit 1

      - name: Install Playwright Driver
        run: |
          git clone https://github.com/microsoft/playwright --branch ${{ steps.version_check.outputs.playwright_version }}
          cd playwright
          npm ci
          cd .. && cp -r playwright playwright_not_patched

      - name: Patch Playwright Driver
        run: |
          cd playwright
          git -C .. submodule update --init --recursive --remote patchright-nodejs
          cd .. && npm run patch

      - name: Create Patch File
        run: utils/create_patch_file.sh

      - name: Upload Patch File
        uses: actions/upload-artifact@v6
        with:
          name: patchright-patch
          path: patchright.patch

      - name: Generate Playwright Channels
        # Ignore the error exit code, as the script exits 1 when a file is modified.
        continue-on-error: true
        run: |
          cd playwright
          node utils/generate_channels.js

      - name: Build Patchright Packages
        run: |
          cd playwright
          npm run build

      - name: Rebrand Patchright Packages
        run: |
          cd playwright
          npx tsx ../patchright-nodejs/patchright_rebranding.ts

      - name: Pack Patchright Packages
        run: |
          mkdir -p artifacts
          npm pack ./playwright/packages/patchright-core --pack-destination artifacts
          npm pack ./playwright/packages/patchright --pack-destination artifacts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        id: upload_build_artifacts
        with:
          name: patchright-packages
          path: artifacts/*.tgz

  # Commits patchright.patch to the PR branch, so squash merges dont need a separate Patch-Comparison commit.
  # SECURITY: This job has write access, so it must never execute PR code. The patch artifact is only handled as data.
  commit-patch-file:
    name: "​" # NOTE: Were using a zero-width space to save some visual clutter in the GitHub Pull Request UI
    needs: build-package
    if: github.event.pull_request.head.repo.full_name == github.repository # Fork PRs only ever get a read-only token

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Pull Request Head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Download outside of the checkout, so the artifact cannot overwrite files like .git/config
      - name: Download Patch File
        uses: actions/download-artifact@v6
        with:
          name: patchright-patch
          path: ${{ runner.temp }}

      - name: Commit and Push Patch File
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          mv "$RUNNER_TEMP/patchright.patch" patchright.patch
          git diff --quiet patchright.patch && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[Patch-Comparison] Automatic Commit" patchright.patch
          git push origin "HEAD:refs/heads/$HEAD_REF"
