name: GitHub Actions Security Analysis

# Checks the workflows in .github/ for security problems with zizmor and shows the results in the Security tab.

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    branches: ["**"]
    paths: ['.github/**']

# No token permissions by default; the job asks only for what it needs.
permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the repository's code scanning tab
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # don't leave the token in .git/config for later steps

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
